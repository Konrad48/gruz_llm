[project]
name = "gruz-llm"
version = "0.1.0"
description = "A document-grounded assistant for your garage"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "python-multipart>=0.0.20",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "playwright>=1.58,<2",
  "beautifulsoup4>=4.13,<5",
  "trafilatura>=2,<3",
  "langfuse>=4,<5",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
