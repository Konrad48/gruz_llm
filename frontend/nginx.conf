server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 21m;
  location ~ \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 150s;
    proxy_buffering off;
    proxy_cache off;
  }
  location / { try_files $uri $uri/ /index.html; }
}
